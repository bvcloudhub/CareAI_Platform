{# Floating care assistant, included on every page from base.html.
   Behaviour lives in static/js/care_bot.js; replies are structured JSON
   rendered as text, never HTML. #}
<div class="care-bot" id="care-bot"
     data-session-url="{{ url_for('care_bot_session') }}"
     data-message-url="{{ url_for('care_bot_message') }}"
     data-restart-url="{{ url_for('care_bot_restart') }}"
     data-handoff-url="{{ url_for('care_bot_handoff') }}"
     {% if care_bot_patient_id %}data-patient-id="{{ care_bot_patient_id }}"{% endif %}>

  <button type="button" class="care-bot-launcher" data-care-bot-toggle
          aria-expanded="false" aria-controls="care-bot-panel" aria-label="{{ care_bot_ui.open }}">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M12 3C6.9 3 3 6.6 3 11c0 2.2 1 4.2 2.7 5.7L5 21l4.2-2.1c.9.2 1.8.3 2.8.3 5.1 0 9-3.6 9-8.2S17.1 3 12 3zm1 11h-2v-2H9v-2h2V8h2v2h2v2h-2v2z"/>
    </svg>
  </button>

  <section class="care-bot-panel" id="care-bot-panel" role="dialog" aria-labelledby="care-bot-title" hidden>
    <header class="care-bot-head">
      <div class="copilot-orb small" aria-hidden="true">✦</div>
      <div class="care-bot-heading">
        <h2 id="care-bot-title">{{ care_bot_ui.title }}</h2>
        <p>{{ care_bot_ui.subtitle }}</p>
      </div>
      <button type="button" class="care-bot-icon-btn" data-care-bot-restart
              title="{{ care_bot_ui.restart }}" aria-label="{{ care_bot_ui.restart }}">↺</button>
      <button type="button" class="care-bot-icon-btn" data-care-bot-toggle
              title="{{ care_bot_ui.close }}" aria-label="{{ care_bot_ui.close }}">✕</button>
    </header>

    <a class="care-bot-emergency" href="tel:112">☎ {{ care_bot_ui.emergency_banner }}</a>

    <div class="care-bot-log" role="log" aria-live="polite" data-care-bot-log></div>
    <div class="care-bot-quick" data-care-bot-quick hidden></div>

    <form class="care-bot-compose" data-care-bot-form>
      <label class="visually-hidden" for="care-bot-input">{{ care_bot_ui.placeholder }}</label>
      <textarea id="care-bot-input" rows="1" maxlength="1000" placeholder="{{ care_bot_ui.placeholder }}"></textarea>
      <button type="submit">{{ care_bot_ui.send }}</button>
    </form>
  </section>

  <script type="application/json" id="care-bot-ui">{{ care_bot_ui|tojson }}</script>
</div>
